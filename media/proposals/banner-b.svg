<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <clipPath id="b-clip"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="b-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="b-rock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b9b6ad"/><stop offset="45%" stop-color="#8e8c86"/><stop offset="100%" stop-color="#55565a"/>
    </linearGradient>
    <linearGradient id="b-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="35%" stop-color="#0a0f12" stop-opacity="0"/><stop offset="100%" stop-color="#0a0f12" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="b-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fc4e6"/><stop offset="100%" stop-color="#4f7ea8"/>
    </linearGradient>
    <filter id="b-blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="b-mist"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g clip-path="url(#b-clip)">
    <rect width="800" height="200" fill="url(#b-bg)"/>
    <ellipse cx="640" cy="60" rx="220" ry="90" fill="#d9a066" opacity="0.14" filter="url(#b-blur)"/>
    <ellipse cx="140" cy="190" rx="220" ry="80" fill="#3f7a52" opacity="0.14" filter="url(#b-blur)"/>

    <!-- far peaks behind the rim -->
    <path d="M470 200 L500 150 L528 96 L556 62 L586 30 L604 46 L632 18 L656 36 L688 12 L714 30 L742 20 L768 34 L800 24 V200 Z" fill="#7a808a" opacity="0.5"/>
    <g fill="#ffffff" opacity="0.85">
      <path d="M578 40 L586 30 L594 38 Z"/><path d="M624 28 L632 18 L640 26 Z"/><path d="M680 22 L688 12 L696 20 Z"/>
      <path d="M736 28 L742 20 L750 26 Z"/><path d="M792 30 L800 24 L800 34 Z"/>
    </g>
    <path d="M470 200 L500 150 L528 96 L556 62 L586 30 L604 46 L632 18 L656 36 L688 12 L714 30 L742 20 L768 34 L800 24 V200 Z" fill="url(#b-fade)"/>

    <!-- main wall of the cirque, rim on top -->
    <path d="M498 200 L504 162 L514 118 L526 84 L538 62 L552 52 L576 48 L600 52 L624 46 L648 50 L672 44 L696 48 L720 42 L744 48 L768 44 L790 48 L800 46 V200 Z" fill="url(#b-rock)"/>
    <!-- gullies -->
    <g fill="#1d1f24">
      <path d="M564 50 L558 92 L562 130 L554 176 L578 176 L572 128 L578 90 L574 49 Z" opacity="0.26"/>
      <path d="M602 52 L596 76 L602 110 L594 152 L612 152 L610 106 L616 74 L612 50 Z" opacity="0.22"/>
      <path d="M646 50 L640 86 L646 120 L636 176 L658 176 L656 118 L660 84 L654 49 Z" opacity="0.3"/>
      <path d="M702 48 L696 68 L704 98 L694 142 L712 142 L714 96 L718 66 L712 46 Z" opacity="0.2"/>
      <path d="M744 48 L736 82 L742 124 L734 176 L756 176 L752 122 L758 80 L754 47 Z" opacity="0.27"/>
      <path d="M784 48 L778 78 L786 106 L780 152 L800 152 L798 104 L800 74 L794 47 Z" opacity="0.18"/>
      <path d="M528 110 L800 98 L800 106 L526 122 Z" opacity="0.14"/>
      <path d="M516 150 L800 138 L800 146 L514 160 Z" opacity="0.14"/>
    </g>
    <!-- lit faces -->
    <g fill="#f2efe6">
      <path d="M552 52 L546 74 L550 96 L560 92 L562 60 Z" opacity="0.14"/>
      <path d="M586 50 L580 66 L588 88 L596 82 L596 56 Z" opacity="0.16"/>
      <path d="M632 48 L626 78 L632 102 L644 98 L642 60 Z" opacity="0.12"/>
      <path d="M680 46 L672 68 L678 92 L690 88 L692 54 Z" opacity="0.15"/>
      <path d="M764 46 L756 84 L762 110 L774 106 L774 60 Z" opacity="0.13"/>
      <path d="M530 96 L800 84 L800 90 L528 104 Z" opacity="0.14"/>
      <path d="M522 130 L800 118 L800 123 L520 138 Z" opacity="0.12"/>
    </g>
    <!-- snow on the ledges -->
    <g fill="#ffffff" opacity="0.8">
      <path d="M530 98 L546 96 L554 100 L536 102 Z"/><path d="M598 96 L622 94 L630 98 L604 100 Z"/><path d="M700 90 L724 88 L732 92 L708 94 Z"/>
      <path d="M740 132 L762 130 L770 134 L746 136 Z"/>
    </g>
    <!-- rim edge -->
    <path d="M504 162 L514 118 L526 84 L538 62 L552 52 L576 48 L600 52 L624 46 L648 50 L672 44 L696 48 L720 42 L744 48 L768 44 L790 48 L800 46" fill="none" stroke="#ece9e0" stroke-width="1.4" opacity="0.75" stroke-linejoin="round"/>
    <path d="M498 200 L504 162 L514 118 L526 84 L538 62 L552 52 L576 48 L600 52 L624 46 L648 50 L672 44 L696 48 L720 42 L744 48 L768 44 L790 48 L800 46 V200 Z" fill="url(#b-fade)"/>

    <!-- mist -->
    <ellipse cx="600" cy="150" rx="140" ry="10" fill="#ffffff" opacity="0.12" filter="url(#b-mist)"/>

    <!-- beech forest at the foot -->
    <g fill="#1c3627"><circle cx="462" cy="180" r="16"/><circle cx="482" cy="179" r="11"/><circle cx="504" cy="183" r="12"/><circle cx="518" cy="178" r="14"/><circle cx="533" cy="184" r="17"/><circle cx="548" cy="179" r="14"/><circle cx="570" cy="178" r="17"/><circle cx="585" cy="188" r="14"/><circle cx="599" cy="178" r="17"/><circle cx="616" cy="186" r="11"/><circle cx="632" cy="184" r="15"/><circle cx="648" cy="187" r="12"/><circle cx="666" cy="179" r="13"/><circle cx="683" cy="179" r="16"/><circle cx="705" cy="187" r="12"/><circle cx="719" cy="185" r="14"/><circle cx="741" cy="190" r="17"/><circle cx="760" cy="187" r="18"/><circle cx="781" cy="182" r="16"/><circle cx="798" cy="189" r="13"/></g>
    <g fill="#142a1e"><circle cx="470" cy="192" r="9"/><circle cx="490" cy="193" r="12"/><circle cx="509" cy="189" r="11"/><circle cx="522" cy="194" r="13"/><circle cx="536" cy="190" r="11"/><circle cx="555" cy="188" r="12"/><circle cx="568" cy="193" r="13"/><circle cx="585" cy="193" r="14"/><circle cx="604" cy="195" r="13"/><circle cx="617" cy="192" r="9"/><circle cx="636" cy="189" r="14"/><circle cx="648" cy="192" r="14"/><circle cx="667" cy="194" r="11"/><circle cx="684" cy="195" r="9"/><circle cx="701" cy="189" r="10"/><circle cx="720" cy="191" r="9"/><circle cx="736" cy="191" r="10"/><circle cx="754" cy="195" r="12"/><circle cx="767" cy="195" r="10"/><circle cx="785" cy="192" r="13"/><circle cx="799" cy="196" r="12"/></g>
    <path d="M0 200 V190 C120 182 260 186 420 184 C440 184 452 186 460 188 V200 Z" fill="#1a3324"/>

    <!-- cable car -->
    <path d="M433 176 L666 38" stroke="#e6e2d8" stroke-width="1.1" opacity="0.8"/>
    <path d="M437 178 L669 41" stroke="#e6e2d8" stroke-width="0.8" opacity="0.5"/>
    <!-- valley station -->
    <rect x="420" y="174" width="26" height="14" rx="1.5" fill="#d4cfc4"/>
    <path d="M417 175 H449 L445 170 H421 Z" fill="#8a4a33"/>
    <!-- El Cable station on the rim -->
    <rect x="654" y="32" width="28" height="14" rx="1.5" fill="#d4cfc4"/>
    <path d="M651 33 H685 L681 27 H655 Z" fill="#8a4a33"/>
    <rect x="662" y="46" width="12" height="6" fill="#bdb8ae"/>
    <!-- cabin -->
    <g transform="translate(551,106)">
      <path d="M0 -6 L0 4" stroke="#e6e2d8" stroke-width="1.4"/>
      <circle cx="0" cy="-6" r="2" fill="#e6e2d8"/>
      <rect x="-11" y="4" width="22" height="17" rx="2.5" fill="#c8362b"/>
      <rect x="-8.5" y="7.5" width="17" height="9" rx="1" fill="url(#b-glass)"/>
      <path d="M-4 7.5 V16.5 M4 7.5 V16.5" stroke="#c8362b" stroke-width="1"/>
      <rect x="-11" y="18" width="22" height="3" fill="#8d2018"/>
    </g>

    <!-- Title -->
    <text x="60" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" fill="#ffffff" font-weight="700" letter-spacing="0.5">awesome-cantabria</text>
    <rect x="62" y="108" width="64" height="3" rx="1.5" fill="#c9c6bd"/>
    <text x="62" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.6" font-weight="400" letter-spacing="3">SOFTWARE OPEN SOURCE PARA CANTABRIA</text>
  </g>
</svg>
